name: Tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12', '3.14']

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install package with test dependencies
        run: python -m pip install --upgrade pip ".[tests]"

      - name: Run tests
        run: pytest

      - name: End-to-end run with dummy backend
        run: |
          cp -r examples "$RUNNER_TEMP/e2e"
          cd "$RUNNER_TEMP/e2e"
          mkdir tst1 tst2
          touch tst1/batch.ready tst2/batch.ready
          model_ensemble test.yaml dummy -ct 1 -st 1 -rt 1 -et 1 -ms 1
          test -f tst1/post_batch.keep
          test -f tst2/post_batch.keep
